<div class="flex h-screen bg-gray-50 overflow-hidden">
  <!-- Sidebar (desktop) -->
  <aside class="hidden md:flex w-64 bg-white shadow-md flex-col">
    <!-- Logo y versión -->
    <div class="flex items-center justify-between p-4 border-b">
      <div class="flex items-center gap-2">
        <div class="bg-cyan-400 rounded-lg p-2">
          <i class="fas fa-c text-white text-lg"></i>
        </div>
        <span class="font-bold text-lg">CrTecnologia</span>
      </div>
      <span class="text-xs bg-gray-100 px-2 py-0.5 rounded-full">4.13.3</span>
    </div>

    <!-- Usuario -->
    <div
      class="mx-3 mt-4 bg-gray-50 rounded-xl shadow-lg p-5 flex flex-col items-center text-center"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center"
        >
          <i class="fas fa-user text-gray-400 text-lg"></i>
        </div>
        <div>
          <p class="font-semibold text-gray-800">{{ user?.emp_name }}</p>
          <p class="text-sm text-gray-500">{{ user?.emp_email }}</p>
        </div>
      </div>
      <hr class="w-full my-3 border-gray-200" />
      <button
        class="w-full flex items-center gap-2 text-sm text-gray-700 hover:text-gray-900 py-2 font-bold"
      >
        <i class="fas fa-cog text-gray-500"></i> Configuraciones
      </button>
      <button
        class="w-full flex items-center gap-2 text-sm text-gray-700 hover:text-gray-900 py-2 font-bold"
      >
        <i class="fas fa-plus text-gray-500"></i> Agregar otro negocio
      </button>
    </div>

    <!-- Menú -->
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto text-sm font-medium">
      <a
        (click)="goToPage('sell')"
        [ngClass]="{
          'bg-yellow-100 text-yellow-700 font-bold': currentPage === 'sell',
          'text-gray-700 hover:bg-gray-100': currentPage !== 'sell'
        }"
        class="flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer transition-colors"
      >
        <i class="fas fa-tag"></i> Vender
      </a>

      <a
        (click)="goToPage('movements')"
        [ngClass]="{
          'bg-yellow-100 text-yellow-700 font-bold':
            currentPage === 'movements',
          'text-gray-700 hover:bg-gray-100': currentPage !== 'movements'
        }"
        class="flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer transition-colors"
      >
        <i class="fas fa-receipt"></i> Movimientos
      </a>

      <a
        (click)="goToPage('statistics')"
        [ngClass]="{
          'bg-yellow-100 text-yellow-700 font-bold':
            currentPage === 'statistics',
          'text-gray-700 hover:bg-gray-100': currentPage !== 'statistics'
        }"
        class="flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer transition-colors"
      >
        <span class="flex items-center gap-3"
          ><i class="fas fa-chart-line"></i> Estadísticas</span
        >
        <i class="fas fa-crown text-yellow-500"></i>
      </a>

      <a
        (click)="goToPage('inventory')"
        [ngClass]="{
          'bg-yellow-100 text-yellow-700 font-bold':
            currentPage === 'inventory',
          'text-gray-700 hover:bg-gray-100': currentPage !== 'inventory'
        }"
        class="flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer transition-colors"
      >
        <i class="fas fa-box"></i> Inventario
      </a>

      <a
        (click)="goToPage('employees')"
        [ngClass]="{
          'bg-yellow-100 text-yellow-700 font-bold':
            currentPage === 'employees',
          'text-gray-700 hover:bg-gray-100': currentPage !== 'employees'
        }"
        class="flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer transition-colors"
      >
        <i class="fas fa-users"></i> Empleados
      </a>

      <a
        (click)="goToPage('service')"
        [ngClass]="{
          'bg-yellow-100 text-yellow-700 font-bold': currentPage === 'service',
          'text-gray-700 hover:bg-gray-100': currentPage !== 'service'
        }"
        class="flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer transition-colors"
      >
        <i class="fa-solid fa-mobile-retro"></i>Servicio Técnico
      </a>

      <p class="text-xs text-gray-400 mt-5 px-3 uppercase tracking-wide">
        Gestiona tus contactos
      </p>

      <a
        (click)="goToPage('clients')"
        [ngClass]="{
          'bg-yellow-100 text-yellow-700 font-bold': currentPage === 'clients',
          'text-gray-700 hover:bg-gray-100': currentPage !== 'clients'
        }"
        class="flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer transition-colors"
      >
        <span class="flex items-center gap-3"
          ><i class="fas fa-user"></i> Clientes</span
        >
        <i class="fas fa-crown text-yellow-500"></i>
      </a>

      <a
        (click)="goToPage('suppliers')"
        [ngClass]="{
          'bg-yellow-100 text-yellow-700 font-bold':
            currentPage === 'suppliers',
          'text-gray-700 hover:bg-gray-100': currentPage !== 'suppliers'
        }"
        class="flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer transition-colors"
      >
        <span class="flex items-center gap-3"
          ><i class="fas fa-truck"></i> Proveedores</span
        >
        <i class="fas fa-crown text-yellow-500"></i>
      </a>
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t space-y-2 text-sm">
      <a
        (click)="showModal()"
        class="flex items-center gap-2 text-red-500 hover:text-red-600 cursor-pointer"
      >
        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
      </a>
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div class="flex-1 overflow-y-auto p-0 md:p-3">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Bottom Nav (mobile) -->
<nav
  class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur rounded-[5rem] flex justify-around items-center w-[90%] max-w-md py-3 px-4 md:hidden z-50 shadow-[0_20px_50px_rgba(0,0,0,0.25)] border border-gray-200/40"
>
  <a
    (click)="goToPage('home')"
    class="flex flex-col items-center text-gray-500 hover:text-yellow-500"
  >
    <i class="fas fa-home text-lg"></i>
    <span class="text-xs mt-1">Home</span>
  </a>
  <a
    (click)="goToPage('home')"
    class="flex flex-col items-center text-gray-500 hover:text-yellow-500"
  >
    <i class="fas fa-receipt text-lg"></i>
    <span class="text-xs mt-1">Balance</span>
  </a>
  <a
    (click)="goToPage('home')"
    class="flex flex-col items-center text-gray-500 hover:text-yellow-500"
  >
    <i class="fas fa-file-invoice-dollar text-lg"></i>
    <span class="text-xs mt-1">Deudas</span>
  </a>
  <a
    (click)="goToPage('home')"
    class="flex flex-col items-center text-gray-500 hover:text-yellow-500"
  >
    <i class="fas fa-box text-lg"></i>
    <span class="text-xs mt-1">Inventario</span>
  </a>
</nav>

<div
  *ngIf="modal"
  class="fixed inset-0 bg-black/40 flex items-center justify-center z-50"
>
  <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 w-full max-w-sm">
    <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">
      ¿Cerrar sesión?
    </h3>
    <p class="text-gray-600 mb-6 text-center">
      ¿Estás seguro que quieres cerrar tu sesión actual?
    </p>
    <div class="flex justify-center gap-4">
      <button
        (click)="showModal()"
        class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-lg transition"
      >
        Cancelar
      </button>
      <button
        (click)="onConfirm()"
        class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition"
      >
        <app-loading *ngIf="loading" />
        <span *ngIf="!loading">Cerrar sesión</span>
      </button>
    </div>
  </div>
</div>
