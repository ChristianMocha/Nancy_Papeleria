<div class="flex h-screen bg-gray-50 overflow-hidden">
  <!-- Sidebar (desktop) -->
  <aside class="hidden md:flex w-64 bg-white shadow-md flex-col">
    <!-- Logo y versión -->
    <div class="flex items-center justify-between p-4 border-b">
      <div class="flex items-center gap-2">
        <div class="bg-yellow-400 rounded-lg p-2">
          <i class="fas fa-t text-white text-lg"></i>
        </div>
        <span class="font-bold text-lg">Treinta</span>
      </div>
      <span class="text-xs bg-gray-100 px-2 py-0.5 rounded-full">4.13.3</span>
    </div>

    <!-- Usuario -->
    <div class="mx-3 mt-4 bg-gray-50 rounded-xl shadow-lg p-5 flex flex-col items-center text-center">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center">
          <i class="fas fa-user text-gray-400 text-lg"></i>
        </div>
        <div>
          <p class="font-semibold text-gray-800">Crtecnologia</p>
          <p class="text-sm text-gray-500">Propietario</p>
        </div>
      </div>
      <hr class="w-full my-3 border-gray-200" />
      <button class="w-full flex items-center gap-2 text-sm text-gray-700 hover:text-gray-900 py-2 font-bold">
        <i class="fas fa-cog text-gray-500"></i> Configuraciones
      </button>
      <button class="w-full flex items-center gap-2 text-sm text-gray-700 hover:text-gray-900 py-2 font-bold">
        <i class="fas fa-plus text-gray-500"></i> Agregar otro negocio
      </button>
    </div>

    <!-- Menú -->
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto text-sm font-medium">
      <a (click)="goToPage('sell')" class="flex items-center gap-3 px-3 cursor-pointer py-2 rounded-lg hover:bg-gray-100">
        <i class="fas fa-tag text-gray-500"></i> Vender
      </a>
      <a (click)="goToPage('movements')" class="flex items-center gap-3 px-3 cursor-pointer py-2 rounded-lg hover:bg-gray-100">
        <i class="fas fa-receipt text-gray-500"></i> Movimientos
      </a>
      <a (click)="goToPage('statistics')"  class="flex items-center cursor-pointer justify-between px-3 py-2 rounded-lg hover:bg-gray-100">
        <span class="flex items-center gap-3"><i class="fas fa-chart-line text-gray-500"></i> Estadísticas</span>
        <i class="fas fa-crown text-yellow-500"></i>
      </a>
      <a (click)="goToPage('inventory')" class="flex items-center gap-3 px-3 cursor-pointer py-2 rounded-lg hover:bg-gray-100">
        <i class="fas fa-box text-gray-500"></i> Inventario
      </a>
      <a (click)="goToPage('employees')" class="flex items-center gap-3 px-3 cursor-pointer py-2 rounded-lg hover:bg-gray-100">
        <i class="fas fa-users text-gray-500"></i> Empleados
      </a>
      
      <p class="text-xs text-gray-400 mt-5 px-3 uppercase tracking-wide">Gestiona tus contactos</p>
      <a (click)="goToPage('clients')" class="flex items-center cursor-pointer justify-between px-3 py-2 rounded-lg bg-yellow-100 text-yellow-700">
        <span class="flex items-center gap-3"><i class="fas fa-user"></i> Clientes</span>
        <i class="fas fa-crown text-yellow-500"></i>
      </a>
      <a (click)="goToPage('suppliers')" class="flex items-center cursor-pointer justify-between px-3 py-2 rounded-lg hover:bg-gray-100">
        <span class="flex items-center gap-3"><i class="fas fa-truck text-gray-500"></i> Proveedores</span>
        <i class="fas fa-crown text-yellow-500"></i>
      </a>
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t space-y-2 text-sm">
      <!-- <a href="#" class="flex items-center gap-2 text-gray-600 hover:text-gray-900">
        <i class="fas fa-question-circle text-gray-500"></i> Aprende a usar Treinta
      </a> -->
      <a href="#" class="flex items-center gap-2 text-red-500 hover:text-red-600">
        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
      </a>
      <!-- <a href="#" class="block text-xs text-gray-400 hover:text-gray-600">Términos y condiciones</a>
      <a href="#" class="block text-xs text-gray-400 hover:text-gray-600">Política de privacidad</a> -->
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div class="flex-1 overflow-y-auto p-2 md:p-3">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Bottom Nav (mobile) -->
<nav class="fixed bottom-5 left-1/2 transform -translate-x-1/2 
            bg-white shadow-lg rounded-[5rem] flex justify-around items-center 
            w-[90%] max-w-md py-3 px-4 md:hidden z-50">
  <a href="#" class="flex flex-col items-center text-gray-500 hover:text-yellow-500">
    <i class="fas fa-home text-lg"></i>
    <span class="text-xs mt-1">Home</span>
  </a>
  <a href="#" class="flex flex-col items-center text-gray-500 hover:text-yellow-500">
    <i class="fas fa-receipt text-lg"></i>
    <span class="text-xs mt-1">Balance</span>
  </a>
  <a href="#" class="flex flex-col items-center text-gray-500 hover:text-yellow-500">
    <i class="fas fa-file-invoice-dollar text-lg"></i>
    <span class="text-xs mt-1">Deudas</span>
  </a>
  <a href="#" class="flex flex-col items-center text-gray-500 hover:text-yellow-500">
    <i class="fas fa-box text-lg"></i>
    <span class="text-xs mt-1">Inventario</span>
  </a>
</nav>
