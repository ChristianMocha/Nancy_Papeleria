<div class="p-6 space-y-6">
  <!-- Filtros -->
  <div class="flex items-center gap-4">
    <select class="border rounded-lg px-3 py-2 text-gray-700 focus:ring-2 focus:ring-blue-500">
      <option>Diario</option>
      <option>Semanal</option>
      <option>Mensual</option>
    </select>

    <div class="flex items-center gap-2 border rounded-lg px-3 py-2 cursor-pointer">
      <span>{{ fecha }}</span>
      <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0
          00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    </div>
  </div>

  <!-- Total de gastos -->
 <div class="border rounded-lg p-4 bg-white shadow-lg w-1/2">
  <h2 class="text-gray-500 text-sm font-medium">Total gastos</h2>
  <p class="text-3xl font-bold text-gray-800">{{ totalGastos }}</p>
  <p class="text-sm text-gray-400">{{ comparacion }}</p>
</div>


  <!-- Tabla de detalle -->
  <div class="border rounded-lg overflow-hidden bg-white shadow-sm">
    <div class="border-b px-4 py-3 bg-gray-50 text-gray-600 font-medium">
      Detalle de gastos
    </div>

    <table class="w-full text-left text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2">Tipo de gasto</th>
          <th class="px-4 py-2">Total gastos</th>
          <th class="px-4 py-2">Porcentaje</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let gasto of gastos" class="border-t">
          <td class="px-4 py-3">{{ gasto.tipo }}</td>
          <td class="px-4 py-3 flex items-center gap-2">
            <span>{{ gasto.total }}</span>
            <span
              [ngClass]="{
                'text-red-500': gasto.tendencia === 'up',
                'text-green-500': gasto.tendencia === 'down'
              }"
            >
              <svg *ngIf="gasto.tendencia === 'up'" class="w-4 h-4" fill="currentColor"
                viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                  d="M5 10a1 1 0 011-1h3V6a1 1 0 112 0v3h3a1 1 0 110 2h-3v3a1 1 0
                   11-2 0v-3H6a1 1 0 01-1-1z"
                  clip-rule="evenodd" />
              </svg>
              <svg *ngIf="gasto.tendencia === 'down'" class="w-4 h-4" fill="currentColor"
                viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                  d="M5 10a1 1 0 011 1v3h8v-3a1 1 0 112 0v4a1 1 0
                   01-1 1H6a1 1 0 01-1-1v-4a1 1 0 011-1z"
                  clip-rule="evenodd" />
              </svg>
            </span>
          </td>
          <td class="px-4 py-3">{{ gasto.porcentaje }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
