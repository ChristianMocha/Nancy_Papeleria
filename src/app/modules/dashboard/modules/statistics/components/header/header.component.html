<!-- Header Card con Tabs -->
<div class="flex items-center justify-between border-b border-green-600 pb-2">
  <!-- Título + Input -->
  <div class="flex items-center gap-4">
    <h2 class="text-xl font-bold text-gray-900">Estadísticas</h2>
  </div>

  <!-- Tabs -->
  <div class="flex space-x-6">
    <button 
      *ngFor="let tab of tabs"
      (click)="activeTab = tab"
      class="pb-2 text-sm font-medium relative"
      [ngClass]="activeTab === tab ? 'text-green-600' : 'text-gray-500 hover:text-gray-700'">
      {{ tab }}
      <!-- Línea activa -->
      <span *ngIf="activeTab === tab" 
            class="absolute bottom-0 left-0 w-full h-[2px] bg-green-600"></span>
    </button>
  </div>
</div>

<!-- Contenido dinámico -->
<div class="p-4">
  <ng-container [ngSwitch]="activeTab">
    <div *ngSwitchCase="'Ventas'">
        <app-sales></app-sales>
    </div>
    <div *ngSwitchCase="'Gastos'">
        <app-bills></app-bills>
    </div>
    <div *ngSwitchCase="'Empleados'">
        <app-employees></app-employees>
    </div>
  </ng-container>
</div>
