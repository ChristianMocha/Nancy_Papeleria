<div class="flex flex-col h-screen gap-4">

    <app-header></app-header>
   

  <!-- Contenido principal con dos columnas -->
  <div class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Columna izquierda (productos) -->
    <div class="lg:col-span-2 bg-white rounded-2xl shadow p-4 flex flex-col">
      <!-- Filtros -->
      <div class="flex gap-2 mb-4">
        <button class="bg-yellow-400 text-black px-4 py-2 rounded-full">
          Todos
        </button>
        <button class="bg-gray-200 px-4 py-2 rounded-full">Audífonos</button>
        <button class="bg-gray-200 px-4 py-2 rounded-full">Celulares</button>
      </div>

      <!-- Productos -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Crear producto -->
        <div
          class="flex items-center justify-center border-2 border-dashed rounded-2xl p-4 cursor-pointer hover:bg-gray-50"
        >
          <span class="text-gray-500 font-medium">+ Crear producto</span>
        </div>

        <!-- Producto -->
        <div
          class="border rounded-2xl p-4 shadow hover:shadow-lg cursor-pointer"
        >
          <img
            src="assets/airpods.jpg"
            alt="AirPods"
            class="w-full h-40 object-cover rounded-2xl mb-2"
          />
          <p class="font-semibold">$20</p>
          <p class="text-gray-600">AirPods 4</p>
          <span class="text-green-600 text-sm">10 disponibles</span>
        </div>

        <div
          class="border rounded-2xl p-4 shadow hover:shadow-lg cursor-pointer"
        >
          <img
            src="assets/iphone17.jpg"
            alt="iPhone 17"
            class="w-full h-40 object-cover rounded-2xl mb-2"
          />
          <p class="font-semibold">$1.400</p>
          <p class="text-gray-600">iPhone 17 Pro Max</p>
          <span class="text-green-600 text-sm">20 disponibles</span>
        </div>
      </div>
    </div>

    <!-- Columna derecha (carrito) -->
    <div class="bg-white rounded-2xl shadow p-4 flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Productos</h2>
        <button class="text-blue-600 underline">Vaciar canasta</button>
      </div>

      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <span class="text-6xl">🛒</span>
        <p class="mt-2 text-gray-600">
          Agrega productos rápidamente usando tu lector de código de barras.
        </p>
        <p class="text-gray-400 text-sm">
          Si no está en tu inventario, lo buscaremos en nuestra base de datos.
        </p>
      </div>

      <!-- Footer -->
      <div class="border-t pt-4 flex justify-between items-center">
        <span class="font-semibold">0</span>
        <button class="bg-blue-600 text-white px-6 py-2 rounded-2xl">
          Continuar $0
        </button>
      </div>
    </div>
  </div>
</div>
