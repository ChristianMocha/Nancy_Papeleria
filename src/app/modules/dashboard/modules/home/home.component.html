<nav
  class="w-full
         flex items-center gap-3
         py-3 px-4
         bg-white
         shadow-[0_10px_30px_rgba(0,0,0,0.18)]
         border-b border-gray-200/40
         sticky top-0 z-40"
>
  <!-- Avatar -->
  <div
    class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden"
  >
    <img
      src="assets/images/user.jpg"
      alt="User"
      class="w-full h-full object-cover"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"
    />

    <!-- Icono fallback -->
    <i class="fas fa-user text-gray-500 text-lg hidden"></i>
  </div>

  <!-- Nombre -->
  <span class="text-lg font-semibold text-gray-900">
    Crtecnologia
  </span>
</nav>


<div class="p-3 pb-28">



    <section class="px-4 py-5">
    <h2 class="text-xl font-semibold text-gray-900 mb-4">
        Accesos rápidos
    </h2>

    <!-- 3 CARDS EN FILA -->
    <div class="grid grid-cols-3 gap-3">

        <!-- Venta -->
        <div
        class="bg-[#1F2A33] rounded-[22px] p-4 h-[140px]
                flex flex-col justify-between
                shadow-[0_12px_28px_rgba(0,0,0,0.22)]
                active:scale-[0.97] transition"
        (click)="goTo('sell')"
        >
        <i class="fas fa-chart-line text-yellow-400 text-lg"></i>

        <p class="text-white text-sm font-medium leading-tight">
            Registrar<br />Venta
        </p>
        </div>

        <!-- Gasto -->
        <div
        class="bg-white rounded-[22px] p-4 h-[140px]
                flex flex-col justify-between
                shadow-[0_10px_24px_rgba(0,0,0,0.14)]
                active:scale-[0.97] transition"
        (click)="goTo('movements')"
        >
        <i class="fas fa-chart-line-down text-yellow-400 text-lg"></i>

        <p class="text-gray-900 text-sm font-medium leading-tight">
            Registrar<br />Gasto
        </p>
        </div>

        <!-- Inventario -->
        <div
        class="bg-white rounded-[22px] p-4 h-[140px]
                flex flex-col justify-between
                shadow-[0_10px_24px_rgba(0,0,0,0.14)]
                active:scale-[0.97] transition"
        (click)="goTo('inventory')"
        >
        <i class="fas fa-box text-gray-900 text-lg"></i>

        <p class="text-gray-900 text-sm font-medium leading-tight">
            Ver<br />Inventario
        </p>
        </div>

    </div>
    </section>



    <!-- Banner planes -->
    <section
    class="w-full bg-[#2C5A5A] rounded-3xl p-5 flex items-center justify-between"
    >
    <!-- Texto -->
    <div class="flex-1 pr-3">
        <h2 class="text-white text-xl font-semibold leading-tight">
        ¡Gestiona tus empleados!
        </h2>

        <p class="text-white/90 text-sm mt-2">
        Con el Plan Básico o Pro organiza tu operación.
        </p>

        <button
        class="mt-4 bg-[#E6FFFF] text-[#2C5A5A] font-semibold text-sm px-5 py-2.5 rounded-xl"
        >
        Explorar planes
        </button>
    </div>

    <!-- Imagen -->
    <img
        src="assets/images/plan-empleados.png"
        alt="Planes"
        class="w-20 h-20 object-contain"
    />
    </section>


    <!-- Sugeridos -->
<section class="mt-6">
  <h3 class="text-xl font-semibold text-gray-900 mb-4">
    Sugeridos para ti
  </h3>

  <div class="bg-white rounded-[28px] p-5 shadow-[0_10px_30px_rgba(0,0,0,0.06)]">
    <div class="grid grid-cols-2 gap-5">

      <!-- Empleados -->
      <div
        class="group bg-gradient-to-br from-blue-50 to-blue-100 
               rounded-2xl p-5 flex flex-col items-center 
               active:scale-95 transition"
      >
        <div
          class="w-14 h-14 rounded-2xl  
                 flex items-center justify-center bg-blue-600 
                 shadow-md" 
        >
          <img src="./assets/home/users.png" alt="">
        </div>

        <p class="mt-3 text-base font-semibold text-gray-900">
          Empleados
        </p>
      </div>

      <!-- Proveedores -->
      <div
        class="group bg-gradient-to-br from-orange-50 to-orange-100 
               rounded-2xl p-5 flex flex-col items-center 
               active:scale-95 transition"
      >
        <div
          class="w-14 h-14 rounded-2xl bg-orange-500 
                 flex items-center justify-center 
                 shadow-md"
        >
          <img src="./assets/home/car.png" alt="">
        </div>

        <p class="mt-3 text-base font-semibold text-gray-900">
          Proveedores
        </p>
      </div>

      <!-- Inventario -->
      <div
        class="group bg-gradient-to-br from-green-50 to-green-100 
               rounded-2xl p-5 flex flex-col items-center 
               active:scale-95 transition"
      >
        <div
          class="w-14 h-14 rounded-2xl bg-green-600 
                 flex items-center justify-center 
                 shadow-md"
        >
          <img src="./assets/home/invetory.png" alt="">
        </div>

        <p class="mt-3 text-base font-semibold text-gray-900">
          Inventario
        </p>
      </div>

      <!-- Movimientos -->
      <div
        class="group bg-gradient-to-br from-purple-50 to-purple-100 
               rounded-2xl p-5 flex flex-col items-center 
               active:scale-95 transition"
      >
        <div
          class="w-14 h-14 rounded-2xl bg-purple-600 
                 flex items-center justify-center 
                 shadow-md"
        >
          <img src="./assets/home/movements.png" alt="">
        </div>

        <p class="mt-3 text-base font-semibold text-gray-900">
          Movimientos
        </p>
      </div>

    </div>
  </div>
</section>

</div>
