<div
  class="min-h-screen flex items-center justify-center bg-gray-100"
>
  <div
    class="bg-white/50 backdrop-blur-md border border-gray-200 rounded-3xl p-8 sm:p-12 w-full max-w-md shadow-xl hover:scale-105 transform transition-all duration-500"
  >
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
      Iniciar sesión
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-5">
        <label class="block text-gray-700 mb-2 font-medium">Correo electrónico</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white placeholder-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-400"
          placeholder="ejemplo@correo.com"
        />
        <p
          *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Correo inválido
        </p>
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 mb-2 font-medium">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white placeholder-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-400"
          placeholder="********"
        />
        <p
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          class="text-red-500 text-sm mt-1"
        >
          Contraseña requerida
        </p>
      </div>

      <button
        type="submit"
        class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-xl transition duration-300 flex justify-center items-center gap-2"
      >
        <app-loading *ngIf="loading" />
        <span *ngIf="!loading">Iniciar sesión</span>
      </button>
    </form>
  </div>
</div>
