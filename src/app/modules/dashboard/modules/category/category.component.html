<app-header (emitModal)="showModalCategories()"/>
<div class="bg-white shadow-lg rounded-[10px] p-4 mt-6 h-[90vh]">
    <app-content (category)="category($event)"/>
</div>



<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50" *ngIf="showModal">
  <!-- Contenido del modal -->
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
    
    <!-- Botón de cerrar -->
    <button
      type="button"
      (click)="onClose()"
      class="absolute top-3 right-3 text-gray-500 hover:text-gray-700"
    >
      ✕
    </button>

    <!-- Título -->
    <h2 class="text-lg font-bold text-gray-800 mb-4">
      Nombre de la categoría <span class="text-red-600">*</span>
    </h2>

    <!-- Input -->
    <input
      type="text"
      [(ngModel)]="categoryName"
      placeholder="Celulares, Audífonos, Cables, Accesorios..."
      class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500"
    />

    <!-- Botones -->
    <div class="flex justify-end gap-2">
      <button
        (click)="onClose()"
        class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100"
      >
        Cancelar
      </button>

      <button
      [disabled]=" !(authService.isAdmin() || authService.isEmployee())"
        (click)="onSave()"
        class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-500"
      >
        <span *ngIf="!loading">Guardar</span>
        <app-loading *ngIf="loading"></app-loading>
      </button>
    </div>
  </div>
</div>
