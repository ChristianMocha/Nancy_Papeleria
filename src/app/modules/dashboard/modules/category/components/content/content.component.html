<!-- LOADING -->
<div *ngIf="loading" class="text-center py-10 text-gray-500">
  Cargando categorías...
</div>

<!-- BUSCADOR -->
<div
  class="mb-4 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between"
>
  <div class="w-full sm:max-w-sm">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      placeholder="Buscar por nombre..."
      class="w-full rounded-lg border border-gray-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
    />
  </div>
</div>

<!-- TABLE (Desktop + Mobile con scroll) -->
<div *ngIf="!loading" class="bg-white rounded-xl shadow overflow-hidden">
  <div class="w-full overflow-x-auto">
    <table class="w-full min-w-[700px] text-left">
      <thead class="bg-gray-100 text-sm text-gray-600">
        <tr>
          <th class="p-3 whitespace-nowrap">Nombre</th>
          <th class="p-3 whitespace-nowrap">Fecha</th>
          <th class="p-3 whitespace-nowrap">Cantidad de productos</th>
          <th class="p-3 whitespace-nowrap text-center">Opciones</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let cat of paginatedCategories"
          class="border-t text-sm hover:bg-gray-50 transition"
        >
          <!-- Nombre -->
          <td class="p-3 font-medium text-gray-800 whitespace-nowrap">
            {{ cat.cat_name }}
          </td>

          <!-- Fecha -->
          <td class="p-3 whitespace-nowrap text-gray-600">
            {{
              cat.created_at?.toDate
                ? (cat.created_at.toDate() | date: "dd/MM/yyyy HH:mm:ss")
                : "-"
            }}
          </td>
          <td class="p-3 whitespace-nowrap">
            <span
              class="px-3 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-700"
            >
              {{ cat.productCount }} productos
            </span>
          </td>

          <!-- Opciones -->
          <td class="p-3 whitespace-nowrap">
            <div class="flex justify-center gap-2">
              <button
                (click)="editCategory(cat)"
                class="px-3 py-1 rounded-lg bg-blue-100 text-blue-700 hover:bg-blue-200"
              >
                Editar
              </button>

              <button
                (click)="confirmDelete(cat)"
                class="px-3 py-1 rounded-lg bg-red-100 text-red-700 hover:bg-red-200"
              >
                Eliminar
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- PAGINACIÓN -->
  <div class="flex justify-center items-center gap-3 py-4">
    <button
      (click)="prevPage()"
      [disabled]="currentPage === 1"
      class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Anterior
    </button>

    <span class="text-sm text-gray-600">
      Página {{ currentPage }} de {{ totalPages }}
    </span>

    <button
      (click)="nextPage()"
      [disabled]="currentPage === totalPages"
      class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Siguiente
    </button>
  </div>
</div>
