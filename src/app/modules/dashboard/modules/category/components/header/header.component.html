<div class="flex items-center justify-between border-b border-green-600 pb-2">
  <div class="flex items-center gap-2 shrink-0">
    <button
      type="button"
      onclick="history.back()"
      class="flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray-100 transition"
    >
      <i class="fas fa-arrow-left text-gray-600"></i>
    </button>
    <h2 class="text-xl font-bold text-gray-900">Categorías</h2>
  </div>

  <div class="flex gap-3 hidden lg:flex">
    <button
      (click)="showModalCategories()"
      [disabled]="!(authService.isAdmin() || authService.isEmployee())"
      class="flex items-center gap-2 border border-gray-900 text-gray-900 px-5 py-2 rounded-xl hover:bg-gray-100 transition"
    >
      <i class="fas fa-th-large text-gray-600"></i>
      <span>Categorías</span>
    </button>
  </div>
</div>
