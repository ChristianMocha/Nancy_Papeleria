<div class="p-6 space-y-6">
  <!-- Buscador -->
  <div class="flex items-center w-1/3 bg-gray-100 rounded-lg px-4 py-2 border border-gray-300">
    <svg class="w-5 h-5 text-gray-400 mr-2" fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z" />
    </svg>
    <input type="text" placeholder="Busca un cliente" [(ngModel)]="filtro"
      class="bg-transparent outline-none w-full text-gray-700 placeholder-gray-400" />
  </div>

  <!-- Resumen -->
  <div class="grid grid-cols-2 gap-4">
    <div class="flex items-center border border-gray-300 rounded-lg p-4 space-x-4">
      <svg class="w-8 h-8 text-gray-700" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4s-4 1.79-4 4 1.79 4 4 4zM4 20c0-2.67 5.33-4 8-4s8 1.33 8 4v1H4v-1z" />
      </svg>
      <div>
        <p class="text-gray-800 font-semibold">{{ totalClientes }}</p>
        <p class="text-gray-500 text-sm">Total de proveedores</p>
      </div>
    </div>

    <div class="flex items-center border border-gray-300 rounded-lg p-4 space-x-4">
      <svg class="w-8 h-8 text-gray-700" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M17 9V7a5 5 0 00-10 0v2a2 2 0 00-2 2v7a2 2 0 002 2h10a2 2 0 002-2v-7a2 2 0 00-2-2zm-5 5v2m0-6h.01" />
      </svg>
      <div>
        <p class="text-gray-800 font-semibold">{{ totalPorCobrar | currency:'USD':'symbol' }}</p>
        <p class="text-gray-500 text-sm">Total por pagar</p>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="bg-white rounded-lg shadow">
    <table class="w-full text-left border-collapse">
      <thead class="bg-gray-100 text-gray-600 text-sm">
        <tr>
          <th class="p-3">Nombre</th>
          <th class="p-3">Celular</th>
          <th class="p-3">Documento</th>
          <th class="p-3">Total por pagar</th>
          <th class="p-3">Acciones</th>
        </tr>
      </thead>
      <tbody class="text-gray-700">
        <tr *ngFor="let cliente of clientesFiltrados" class="border-t">
            <td class="p-3">{{ cliente.nombre }}</td>
            <td class="p-3">{{ cliente.celular }}</td>
            <td class="p-3">{{ cliente.documento }}</td>
            <td class="p-3 flex items-center space-x-2">
                <span *ngIf="cliente.totalPorCobrar === 0"
                class="w-6 h-6 flex items-center justify-center rounded-full bg-green-100 text-green-600">
                ✔
                </span>
                <span *ngIf="cliente.totalPorCobrar > 0"
                class="w-6 h-6 flex items-center justify-center rounded-full bg-red-100 text-red-600">
                %
                </span>
                <span>{{ cliente.totalPorCobrar | currency:'USD':'symbol' }}</span>
            </td>

            <td class="p-3">
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <a href="#" class="text-gray-500 hover:text-gray-700">Detalle</a>
                </div>
            </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>
