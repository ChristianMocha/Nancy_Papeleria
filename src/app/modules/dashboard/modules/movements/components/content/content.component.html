<div class="p-4 space-y-6">

  <!-- Tabs -->
  <div class="flex border rounded-lg overflow-hidden">
    <button class="flex-1 py-2 text-white bg-gray-900 font-medium">Transacciones</button>
    <button class="flex-1 py-2 text-gray-600 bg-gray-50 hover:bg-gray-100">Cierres de caja</button>
  </div>

  <!-- Filtros -->
  <div class="flex flex-wrap gap-3 items-center">
    <button class="flex items-center gap-2 border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50">
      <i class="fas fa-sliders-h"></i> Filtrar
    </button>

    <div class="relative">
      <select class="appearance-none border border-gray-300 rounded-lg px-4 py-2 pr-8">
        <option>Diario</option>
        <option>Semanal</option>
        <option>Mensual</option>
      </select>
      <i class="fas fa-chevron-down absolute right-3 top-3 text-gray-400"></i>
    </div>

    <div class="flex items-center border border-gray-300 rounded-lg px-4 py-2">
      <input type="date" class="outline-none" value="2025-09-23" />
    </div>

    <div class="flex items-center border border-gray-300 rounded-lg px-4 py-2 flex-1 max-w-sm">
      <i class="fas fa-search text-gray-400 mr-2"></i>
      <input type="text" placeholder="Buscar concepto..." class="flex-1 outline-none" />
    </div>
  </div>

  <!-- Métricas -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- Balance -->
    <div class="flex items-center gap-3 bg-white p-4 rounded-lg shadow-lg">
      <div class="flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full">
        <i class="fas fa-chart-line"></i>
      </div>
      <div>
        <p class="text-sm text-gray-500">Balance</p>
        <p class="text-lg font-semibold text-gray-900">$0</p>
      </div>
    </div>


    <!-- Ventas totales -->
    <div class="flex items-center gap-3 bg-white p-4 rounded-lg shadow-lg">
      <div class="flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full">
        <i class="fas fa-money-bill-wave"></i>
      </div>
      <div>
        <p class="text-sm text-gray-500">Ventas totales</p>
        <p class="text-lg font-semibold text-gray-900">$0</p>
      </div>
    </div>

    <!-- Gastos totales -->
    <div class="flex items-center gap-3 bg-white p-4 rounded-lg shadow-lg">
      <div class="flex items-center justify-center w-12 h-12 bg-red-100 text-red-500 rounded-full">
        <i class="fas fa-wallet"></i>
      </div>
      <div>
        <p class="text-sm text-gray-500">Gastos totales</p>
        <p class="text-lg font-semibold text-red-600">$0</p>
      </div>
    </div>
  </div>

  <!-- Tabs secundarios -->
  <div class="grid grid-cols-4 text-center text-gray-600 font-medium">
    <div class="border-b-2 border-gray-900 py-2">Ingresos</div>
    <div class="py-2">Egresos</div>
    <div class="py-2">Por cobrar</div>
    <div class="py-2">Por pagar</div>
  </div>

  <!-- Estado vacío -->
  <div class="flex flex-col items-center justify-center py-10 text-center space-y-4">
    <i class="fas fa-wallet text-5xl text-gray-400"></i>
    <p class="text-gray-600">Aún no tienes registros creados en esta fecha.</p>
    <button class="px-6 py-2 bg-gray-900 text-white rounded-lg shadow hover:bg-gray-800">
      Crear un movimiento
    </button>
  </div>

</div>
