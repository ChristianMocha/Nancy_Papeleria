<div class="p-4 space-y-6">
  <!-- Tabs -->
  <div class="flex border rounded-lg overflow-hidden">
    <button class="flex-1 py-2 text-white bg-gray-900 font-medium">
      Transacciones
    </button>
    <button class="flex-1 py-2 text-gray-600 bg-gray-50 hover:bg-gray-100">
      Cierres de caja
    </button>
  </div>

  <!-- Filtros -->
  <div class="flex flex-wrap gap-3 items-center">
    <button
      class="flex items-center gap-2 border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50"
    >
      <i class="fas fa-sliders-h"></i> Filtrar
    </button>

    <div class="relative">
      <select
        [(ngModel)]="selectedRange"
        (change)="onRangeChange()"
        class="appearance-none border border-gray-300 rounded-lg px-4 py-2 pr-8 focus:outline-none"
      >
        <option value="day">Diario</option>
        <option value="week">Semanal</option>
        <option value="month">Mensual</option>
        <option value="year">Anual</option>
      </select>
      <i class="fas fa-chevron-down absolute right-3 top-3 text-gray-400"></i>
    </div>

    <div class="flex items-center border border-gray-300 rounded-lg px-4 py-2">
      <input
        [type]="inputType"
        [(ngModel)]="selectedDate"
        class="flex-1 outline-none bg-transparent text-gray-700"
      />
    </div>

    <div
      class="flex items-center border border-gray-300 rounded-lg px-4 py-2 flex-1 max-w-sm"
    >
      <i class="fa-solid fa-magnifying-glass text-gray-400 text-lg mr-2"></i>

      <input
        type="text"
        [(ngModel)]="searchShopping"
        class="flex-1 outline-none bg-transparent text-gray-700"
        placeholder="Buscar concepto..."
      />
    </div>
  </div>

  <!-- Métricas -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <!-- Balance -->
    <div class="flex items-center gap-3 bg-white p-4 rounded-lg shadow-lg">
      <div
        class="flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full"
      >
        <i class="fas fa-chart-line"></i>
      </div>
      <div>
        <p class="text-sm text-gray-500">Balance</p>
        <p class="text-lg font-semibold text-gray-900">
          {{ balanceAmount | currency }}
        </p>
      </div>
    </div>

    <!-- Ventas totales -->
    <div class="flex items-center gap-3 bg-white p-4 rounded-lg shadow-lg">
      <div
        class="flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full"
      >
        <i class="fas fa-money-bill-wave"></i>
      </div>
      <div>
        <p class="text-sm text-gray-500">Ventas totales</p>
        <p class="text-lg font-semibold text-gray-900">
          {{ totalSales | currency }}
        </p>
      </div>
    </div>

    <div class="flex items-center gap-3 bg-white p-4 rounded-lg shadow-lg">
      <div
        class="flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full"
      >
        <i class="fas fa-money-bill-wave"></i>
      </div>
      <div>
        <p class="text-sm text-gray-500">Ganancias totales</p>
        <p class="text-lg font-semibold text-gray-900">
          {{ totalEarnings | currency }}
        </p>
      </div>
    </div>

    <!-- Gastos totales -->
    <div class="flex items-center gap-3 bg-white p-4 rounded-lg shadow-lg">
      <div
        class="flex items-center justify-center w-12 h-12 bg-red-100 text-red-500 rounded-full"
      >
        <i class="fas fa-wallet"></i>
      </div>
      <div>
        <p class="text-sm text-gray-500">Gastos totales</p>
        <p class="text-lg font-semibold text-red-600">
          {{ billsAmount | currency }}
        </p>
      </div>
    </div>
  </div>

  <!-- Tabs secundarios -->
  <div class="w-full">
    <!-- Tabs -->
    <div class="grid grid-cols-4 text-center text-gray-600 font-medium">
      <div
        class="py-2 cursor-pointer border-b-2"
        [ngClass]="
          selectedTab === 'ingresos'
            ? 'border-gray-900 text-gray-900'
            : 'border-transparent hover:text-gray-800'
        "
        (click)="selectTab('ingresos')"
      >
        Ingresos
      </div>
      <div
        class="py-2 cursor-pointer border-b-2"
        [ngClass]="
          selectedTab === 'egresos'
            ? 'border-gray-900 text-gray-900'
            : 'border-transparent hover:text-gray-800'
        "
        (click)="selectTab('egresos')"
      >
        Egresos
      </div>
    </div>

    <!-- Contenido de cada tab -->
    <div>
      <div *ngIf="selectedTab === 'ingresos'">
        <app-income
          (totalEarningsEmit)="totalEarningsEmit($event)"
          (totalSalesEmit)="totalSalesEmit($event)"
          [selectedDate]="selectedDate" [inputType]="inputType"
          (billsAmountEmit)="billsAmountEmit($event)"
        ></app-income>
      </div>

      <div *ngIf="selectedTab === 'egresos'">
        <app-bills [selectedDate]="selectedDate" [inputType]="inputType"></app-bills>
      </div>
    </div>
  </div>
</div>
