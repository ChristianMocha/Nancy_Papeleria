<app-header (emitModal)="emitModal($event)"></app-header>
<div class="bg-white shadow-lg rounded-[10px] p-6 mt-6 h-[90vh]">
  <app-services
    (service)="service($event)"
    (toggle)="toggle($event)"
  ></app-services>
</div>

<div
  class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50"
  *ngIf="openModal"
>
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6 relative">
    <button
      type="button"
      (click)="onClose()"
      class="absolute top-3 right-3 text-gray-500 hover:text-gray-700"
    >
      ✕
    </button>

    <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">
      <label class="block mb-1 font-medium text-gray-700"
        >Descripción del trabajo</label
      >
      <input
        type="text"
        formControlName="ser_description"
        placeholder="Ej: cambio de pantalla"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-green-500"
      />
      <div
        *ngIf="
          serviceForm.get('ser_description')?.touched &&
          serviceForm.get('ser_description')?.invalid
        "
        class="text-red-500 text-sm mb-2"
      >
        Ingrese una descripción.
      </div>

      <label class="block mb-1 font-medium text-gray-700"
        >Persona que retira</label
      >
      <input
        type="text"
        formControlName="ser_name"
        placeholder="Ej: Criss"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-green-500"
      />
      <div
        *ngIf="
          serviceForm.get('ser_name')?.touched &&
          serviceForm.get('ser_name')?.invalid
        "
        class="text-red-500 text-sm mb-2"
      >
        Ingrese el nombre.
      </div>

      <label class="block mb-1 font-medium text-gray-700">Celular</label>
      <input
        type="text"
        formControlName="ser_phone"
        placeholder="Ej: 999999999"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-green-500"
      />
      <div
        *ngIf="
          serviceForm.get('ser_phone')?.touched &&
          serviceForm.get('ser_phone')?.hasError('required')
        "
        class="text-red-500 text-sm mb-2"
      >
        Ingrese el número de contacto.
      </div>
      <span
        *ngIf="
          serviceForm.get('ser_phone')?.touched &&
          serviceForm.get('ser_phone')?.hasError('pattern') &&
          !serviceForm.get('ser_phone')?.hasError('required')
        "
        class="text-red-500 text-sm mb-2"
      >
        El teléfono debe tener exactamente 10 números.
      </span>

      <label class="block mb-1 font-medium text-gray-700">Precio</label>
      <input
        type="number"
        formControlName="ser_price"
        placeholder="Ej: 35"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-2 focus:outline-none focus:ring-2 focus:ring-green-500"
      />
      <div
        *ngIf="
          serviceForm.get('ser_price')?.touched &&
          serviceForm.get('ser_price')?.hasError('required')
        "
        class="text-red-500 text-sm mb-2"
      >
        Ingrese el precio del cambio.
      </div>

      <label class="block mb-1 font-medium text-gray-700"
        >El trabajo esta pago?</label
      >

      <label class="relative inline-flex items-center cursor-pointer">
        <input
          type="checkbox"
          class="sr-only peer"
          formControlName="ser_paid"
        />
        <div
          class="w-11 h-6 bg-gray-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-green-400 rounded-full peer peer-checked:bg-green-500 transition-colors duration-300"
        ></div>
        <div
          class="absolute left-0.5 top-0.5 bg-white w-5 h-5 rounded-full transition-transform duration-300 peer-checked:translate-x-5"
        ></div>
      </label>

      <label class="block mb-1 font-medium text-gray-700"
        >Tipo de contraseña</label
      >
      <select
        formControlName="ser_password"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500"
      >
        <option value="">Seleccione el tipo</option>
        <option *ngFor="let r of password" [value]="r.code">
          {{ r.name }}
        </option>
      </select>

      <div
        *ngIf="
          serviceForm.get('ser_password')?.touched &&
          serviceForm.get('ser_password')?.invalid
        "
        class="text-red-500 text-sm mb-2"
      >
        Debe seleccionar un tipo de desbloqueo.
      </div>

      <div *ngIf="serviceForm.get('ser_password')?.value == 1">
        <label class="block mb-1 font-medium text-gray-700"
          >Ingrese el código</label
        >
        <input
          type="text"
          formControlName="ser_password_code"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500"
          placeholder="Ej: 1234"
        />
      </div>

      <div *ngIf="serviceForm.get('ser_password')?.value == 2" class="my-4">
        <label class="block mb-1 font-medium text-gray-700"
          >Dibuje el patrón</label
        >
        <div class="center">
          <app-pattern-lock
            (pattern)="onPattern($event)"
            [size]="300"
            [dotRadius]="12"
            [patternInput]="serviceForm.get('ser_pattern')?.value"
          >
          </app-pattern-lock>

          <div class="text-gray-600 text-sm mt-2">
            Patrón guardado: {{ serviceForm.get("ser_pattern")?.value }}
          </div>
        </div>
      </div>

      <div class="flex justify-end mt-4">
        <button
          type="submit"
          class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 disabled:opacity-50"
        >
          <app-loading *ngIf="loading"></app-loading>
          <span *ngIf="!loading">Guardar servicio </span>
        </button>
      </div>
    </form>
  </div>
</div>
