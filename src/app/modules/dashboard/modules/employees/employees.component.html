<app-header (emitModal)="emitModal($event)"></app-header>
<div class="bg-white shadow-lg rounded-[10px] p-6 mt-6 h-[90vh]">
  <app-table></app-table>
</div>

<!-- Fondo oscuro -->
<div
  class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 px-4"
  *ngIf="openModal"
>
  <!-- Contenido del modal -->
  <div
    class="bg-white rounded-lg shadow-lg w-full max-w-md sm:max-w-lg md:max-w-xl lg:max-w-2xl p-4 sm:p-6 relative"
  >
    <!-- Botón de cerrar -->
    <button
      type="button"
      (click)="onClose()"
      class="absolute top-3 right-3 text-gray-500 hover:text-gray-700"
    >
      ✕
    </button>

    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Nombre -->
      <div>
        <label class="block mb-1 font-medium text-gray-700">Nombre</label>
        <input
          type="text"
          formControlName="emp_name"
          placeholder="Ej: Juan"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
        <div
          *ngIf="employeeForm.get('emp_name')?.touched && employeeForm.get('emp_name')?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          Ingrese un nombre.
        </div>
      </div>

      <!-- Correo -->
      <div>
        <label class="block mb-1 font-medium text-gray-700">Correo electrónico</label>
        <input
          type="email"
          formControlName="emp_email"
          placeholder="Ej: usuario@empresa.com"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
        <div
          *ngIf="employeeForm.get('emp_email')?.touched && employeeForm.get('emp_email')?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          Ingrese un correo válido.
        </div>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block mb-1 font-medium text-gray-700">Contraseña</label>
        <input
          type="password"
          formControlName="emp_password"
          placeholder="Mínimo 6 caracteres"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
        <div
          *ngIf="employeeForm.get('emp_password')?.touched && employeeForm.get('emp_password')?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          La contraseña debe tener al menos 6 caracteres.
        </div>
      </div>

      <!-- Rol -->
      <div>
        <label class="block mb-1 font-medium text-gray-700">Rol</label>
        <select
          formControlName="emp_role"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
        >
          <option value="">Seleccione un rol</option>
          <option *ngFor="let r of roles" [value]="r.id">{{ r.nombre }}</option>
        </select>
        <div
          *ngIf="employeeForm.get('emp_role')?.touched && employeeForm.get('emp_role')?.invalid"
          class="text-red-500 text-sm mt-1"
        >
          Debe seleccionar un rol.
        </div>
      </div>

      <!-- Botón Guardar -->
      <div class="flex justify-end mt-2">
        <button
          type="submit"
          [disabled]="employeeForm.invalid"
          class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 disabled:opacity-50 flex items-center justify-center gap-2"
        >
          <app-loading *ngIf="loading"></app-loading>
          <span *ngIf="!loading">Crear usuario</span>
        </button>
      </div>
    </form>
  </div>
</div>
