<div class="flex items-center justify-between border-b border-green-600 pb-2">
  <!-- Título con ícono dentro de círculo -->

  <div class="flex items-center gap-2 shrink-0">
    <button
      type="button"
      onclick="history.back()"
      class="flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray-100 transition"
    >
      <i class="fas fa-arrow-left text-gray-600"></i>
    </button>
    <h2 class="text-xl font-bold text-gray-900">Empleados</h2>
  </div>
  <!-- Botón -->
  <button
    *ngIf="authService.isAdmin()"
    class="flex items-center gap-2 bg-gray-900 text-white px-5 py-2 rounded-xl shadow hover:bg-gray-800 transition"
    (click)="onCrearCliente()"
  >
    <i class="fas fa-plus"></i>
    Crear empleado
  </button>
</div>
