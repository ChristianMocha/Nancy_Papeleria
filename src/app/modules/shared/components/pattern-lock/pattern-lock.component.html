<div class="pattern-container">
  <button
    type="button"
    (click)="clear()"
    class="mt-4 flex items-center gap-2 px-4 py-2 bg-red-500 text-white font-medium rounded-xl shadow-md hover:bg-red-600 hover:shadow-lg active:scale-95 transition-all duration-200 float-right"
  >
    <i class="fas fa-eraser text-lg"></i> Limpiar
  </button>

  <svg #svgEl [attr.width]="size()" [attr.height]="size()">
    <g>
      <circle
        *ngFor="let c of circles"
        [attr.cx]="c.x"
        [attr.cy]="c.y"
        [attr.r]="dotRadius()"
        stroke="#333"
        stroke-width="2"
        fill="white"
      />
    </g>

    <polyline
      *ngIf="points.length"
      [attr.points]="polylinePoints"
      stroke="#10b981"
      stroke-width="5"
      fill="none"
      stroke-linecap="round"
    ></polyline>

    <g *ngIf="points.length">
      <circle
        [attr.cx]="points[0].x"
        [attr.cy]="points[0].y"
        r="10"
        fill="#10b981"
        stroke="white"
        stroke-width="3"
      ></circle>

      <text
        [attr.x]="points[0].x"
        [attr.y]="points[0].y + 4"
        text-anchor="middle"
        font-size="12"
        fill="white"
        font-weight="bold"
      >
        0
      </text>
    </g>

    <g *ngIf="points.length > 1">
      <circle
        [attr.cx]="points[points.length - 1].x"
        [attr.cy]="points[points.length - 1].y"
        r="10"
        fill="#ef4444"
        stroke="white"
        stroke-width="3"
      ></circle>

      <text
        [attr.x]="points[points.length - 1].x"
        [attr.y]="points[points.length - 1].y + 4"
        text-anchor="middle"
        font-size="12"
        fill="white"
        font-weight="bold"
      >
        1
      </text>
    </g>
  </svg>
</div>
